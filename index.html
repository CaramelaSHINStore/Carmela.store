<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12100e">
    <title>متجر كارامل - Caramel Store</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #c89666;
            --accent-soft: #ebd0b0;
            --accent-deep: #996738;
            --accent-tint: rgba(200, 150, 102, 0.08);
            --bg-page: #f6f3ee;
            --espresso: #12100e;
            --espresso-soft: #241e1a;
            --text-main: #181412;
            --text-muted: #675f57;
            --border-soft: rgba(24, 20, 18, 0.09);
            --shadow-card: 0 10px 24px -16px rgba(18, 16, 14, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-page); color: var(--text-main); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; }
        button, input, select, textarea { font-family: 'Cairo', sans-serif; }
        button { cursor: pointer; border: none; background: none; }

        .top-bar { position: sticky; top: 0; z-index: 100; background: rgba(18, 16, 14, 0.96); backdrop-filter: blur(14px); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
        .brand-row { display: flex; align-items: center; justify-content: space-between; }
        .brand-btn { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-weight: 900; letter-spacing: 1.5px; font-size: 1rem; }
        .brand-sub { font-size: 0.65rem; color: var(--accent-soft); font-weight: 700; display: block; letter-spacing: 0; }
        .share-btn { background: rgba(255,255,255,0.1); color: var(--accent-soft); padding: 6px 12px; border-radius: 10px; font-size: 0.78rem; font-weight: 800; }

        .search-box { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--accent); border-radius: 999px; padding: 4px 12px; }
        .search-box input { flex: 1; border: none; outline: none; font-size: 0.85rem; font-weight: 700; color: var(--text-main); background: transparent; }
        .search-clear { color: #b91c1c; font-size: 0.75rem; font-weight: 800; display: none; }
        .search-clear.show { display: inline-block; }

        .cat-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--border-soft); }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab { padding: 5px 13px; border-radius: 999px; font-size: 0.8rem; font-weight: 800; background: var(--bg-page); color: var(--espresso-soft); white-space: nowrap; }
        .cat-tab.active { background: var(--espresso); color: var(--accent-soft); }

        .container { max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 14px 96px; flex: 1; }

        .spotlights { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
        @media (min-width: 820px) { .spotlights { grid-template-columns: 1fr 1fr; } }
        .spot-card { background: #fff; border: 1px solid var(--border-soft); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-card); }
        .spot-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .spot-title { font-size: 0.95rem; font-weight: 900; color: var(--espresso); }
        .spot-badge { font-size: 0.7rem; font-weight: 800; color: var(--accent-deep); background: var(--accent-tint); padding: 2px 10px; border-radius: 999px; }
        .spot-item { background: var(--bg-page); border-radius: 14px; padding: 10px 12px; cursor: pointer; }
        .spot-item-title { font-size: 0.88rem; font-weight: 900; color: var(--espresso); }
        .spot-item-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 0.76rem; color: var(--text-muted); font-weight: 800; }
        .spot-price { color: var(--accent-deep); font-size: 0.92rem; font-weight: 900; }

        .filter-row { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
        .filter-row::-webkit-scrollbar { display: none; }
        .mode-btn { padding: 6px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 800; background: #fff; border: 1px solid var(--border-soft); white-space: nowrap; }
        .mode-btn.active { background: var(--espresso); color: var(--accent-soft); }

        .merchant-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; background: var(--espresso); color: #fff; border-radius: 16px; padding: 12px 16px; margin-bottom: 14px; flex-wrap: wrap; }
        .merchant-bar.show { display: flex; }
        .merchant-back { background: #fff; color: var(--espresso); padding: 6px 12px; border-radius: 10px; font-size: 0.78rem; font-weight: 900; }

        .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-head h2 { font-size: 1.05rem; font-weight: 900; }
        .count-pill { font-size: 0.74rem; font-weight: 800; color: var(--accent-deep); background: var(--accent-tint); padding: 2px 10px; border-radius: 999px; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        .card { background: #fff; border: 1px solid var(--border-soft); border-radius: 18px; padding: 12px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
        .card-title { font-size: 0.88rem; font-weight: 900; color: var(--text-main); cursor: pointer; line-height: 1.38; }
        .card-price { font-size: 1.02rem; font-weight: 900; color: var(--accent-deep); margin-top: 4px; }
        .card-desc { font-size: 0.73rem; color: var(--text-muted); font-weight: 700; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .merchant-chip { margin-top: 7px; display: inline-block; background: var(--accent-tint); color: var(--accent-deep); border-radius: 999px; padding: 2px 9px; font-size: 0.68rem; font-weight: 800; }

        .card-actions { display: grid; grid-template-columns: 1.3fr 0.8fr; gap: 6px; }
        .btn-add { padding: 8px; border-radius: 11px; background: var(--espresso); color: #fff; font-size: 0.75rem; font-weight: 800; }
        .btn-wa { padding: 8px; border-radius: 11px; background: rgba(22, 163, 74, 0.1); color: #15803d; font-size: 0.74rem; font-weight: 800; text-align: center; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 110; background: #fff; border-top: 1px solid var(--border-soft); display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px 4px; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 800; color: var(--text-muted); position: relative; padding: 3px; }
        .nav-btn.active { color: var(--accent-deep); font-weight: 900; }
        .cart-badge { position: absolute; top: 0; right: 55%; background: var(--accent-deep); color: #fff; min-width: 17px; height: 17px; border-radius: 999px; font-size: 0.65rem; font-weight: 900; display: none; align-items: center; justify-content: center; }
        .cart-badge.show { display: inline-flex; }

        .backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 200; }
        .backdrop.show { display: flex; align-items: center; justify-content: center; padding: 14px; }
        .drawer { position: fixed; top: 0; bottom: 0; width: min(400px, 94vw); background: #fff; z-index: 210; display: flex; flex-direction: column; transition: transform 0.25s ease; }
        .drawer-right { right: 0; transform: translateX(105%); }
        .drawer-right.open { transform: translateX(0); }
        .drawer-left { left: 0; transform: translateX(-105%); }
        .drawer-left.open { transform: translateX(0); }

        .drawer-head { background: var(--espresso); color: var(--accent-soft); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg-page); display: flex; flex-direction: column; gap: 8px; }
        .drawer-foot { padding: 12px; background: #fff; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 8px; }

        .modal-card { width: min(420px, 95vw); background: #fff; border-radius: 20px; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-body { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: var(--bg-page); }
        .pills { display: flex; flex-wrap: wrap; gap: 6px; }
        .pill { padding: 5px 11px; border-radius: 10px; border: 1px solid var(--border-soft); background: #fff; font-size: 0.78rem; font-weight: 800; }
        .pill.active { background: var(--espresso); color: var(--accent-soft); }
        .note-input { width: 100%; min-height: 58px; padding: 8px; border-radius: 10px; border: 1px solid var(--border-soft); font-size: 0.8rem; }
        .btn-primary { width: 100%; padding: 10px; border-radius: 12px; background: var(--espresso); color: var(--accent-soft); font-weight: 900; }
        .btn-wa-big { width: 100%; padding: 10px; border-radius: 12px; background: #16a34a; color: #fff; font-weight: 900; }
        .btn-danger { width: 100%; padding: 7px; border-radius: 10px; background: #fef2f2; color: #b91c1c; font-size: 0.78rem; font-weight: 800; }

        .cart-row { background: #fff; border: 1px solid var(--border-soft); border-radius: 12px; padding: 9px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .qty-box { display: flex; align-items: center; gap: 4px; }
        .qty-btn { width: 24px; height: 24px; border-radius: 7px; background: var(--espresso); color: var(--accent-soft); font-weight: 900; }
        .del-btn { background: #fef2f2; color: #b91c1c; border-radius: 7px; padding: 2px 7px; font-weight: 900; }

        .toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--espresso); color: var(--accent-soft); padding: 8px 16px; border-radius: 999px; font-size: 0.8rem; font-weight: 800; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .toast.show { opacity: 1; }
        footer { text-align: center; padding: 18px 14px 80px; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="brand-row">
            <button type="button" class="brand-btn" onclick="resetStore()">
                <span>CARAMEL<span class="brand-sub">متجر كارامل • كل قطعة وليها دور</span></span>
            </button>
            <button type="button" class="share-btn" onclick="shareStore()">مشاركة</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج، تاجر، أو قسم..." oninput="renderProducts()">
            <button type="button" class="search-clear" id="searchClearBtn" onclick="clearSearch()">مسح</button>
        </div>
    </header>

    <nav class="cat-tabs" id="topCatTabs"></nav>

    <main class="container">
        <section class="spotlights">
            <div class="spot-card">
                <div class="spot-head"><span class="spot-title">ترندات كارامل</span><span class="spot-badge">الأكثر طلباً</span></div>
                <div id="trendsBox"></div>
            </div>
            <div class="spot-card">
                <div class="spot-head"><span class="spot-title">أسعار مميزة</span><span class="spot-badge">توفير</span></div>
                <div id="dealsBox"></div>
            </div>
        </section>

        <div class="filter-row">
            <button type="button" class="mode-btn active" data-mode="default" onclick="setSortMode('default', this)">الافتراضي</button>
            <button type="button" class="mode-btn" data-mode="new" onclick="setSortMode('new', this)">الأحدث</button>
            <button type="button" class="mode-btn" data-mode="cheap" onclick="setSortMode('cheap', this)">الأقل سعراً</button>
        </div>

        <section class="merchant-bar" id="merchantBar">
            <div><strong id="merchantBarTitle"></strong> <span id="merchantBarCount"></span></div>
            <button type="button" class="merchant-back" onclick="clearMerchant()">كل التجار</button>
        </section>

        <div class="section-head">
            <h2 id="sectionTitle">كل المنتجات</h2>
            <span class="count-pill" id="countBadge">0 منتج</span>
        </div>

        <section class="grid" id="productsGrid"></section>
    </main>

    <nav class="bottom-nav">
        <button type="button" class="nav-btn active" onclick="resetStore()">الرئيسية</button>
        <button type="button" class="nav-btn" onclick="openCatsDrawer()">الفئات</button>
        <button type="button" class="nav-btn" onclick="openCart()">
            <span class="cart-badge" id="cartBadge"></span>
            المشتريات
        </button>
        <a href="https://wa.me/201055436305" target="_blank" rel="noopener noreferrer" class="nav-btn">واتساب</a>
    </nav>

    <div class="backdrop" id="catsBackdrop" onclick="closeCatsDrawer()"></div>
    <aside class="drawer drawer-right" id="catsDrawer">
        <div class="drawer-head"><span>فئات المتجر</span><button type="button" onclick="closeCatsDrawer()" style="color:#fff;font-size:1.2rem;">&times;</button></div>
        <div class="drawer-body" id="catsDrawerBody"></div>
    </aside>

    <div class="backdrop" id="cartBackdrop" onclick="closeCart()"></div>
    <aside class="drawer drawer-left" id="cartDrawer">
        <div class="drawer-head"><span>المشتريات</span><button type="button" onclick="closeCart()" style="color:#fff;font-size:1.2rem;">&times;</button></div>
        <div class="drawer-body" id="cartBody"></div>
        <div class="drawer-foot">
            <div style="display:flex;justify-content:space-between;font-weight:900;"><span>الإجمالي:</span><span id="cartTotal">0 جنيه</span></div>
            <button type="button" class="btn-wa-big" onclick="checkoutWA()">إتمام الطلب عبر واتساب</button>
            <button type="button" class="btn-danger" onclick="clearCart()">تفريغ السلة</button>
        </div>
    </aside>

    <div class="backdrop" id="optBackdrop" onclick="closeOptionModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="drawer-head"><span id="optTitle">تفاصيل المنتج</span><button type="button" onclick="closeOptionModal()" style="color:#fff;font-size:1.2rem;">&times;</button></div>
            <div class="modal-body">
                <div id="optPrice" style="font-weight:900;color:var(--accent-deep);"></div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-weight:800;font-size:0.82rem;">العدد:</span>
                    <div class="qty-box">
                        <button type="button" class="qty-btn" onclick="changeOptQty(1)">+</button>
                        <span id="optQty" style="min-width:20px;text-align:center;font-weight:900;">1</span>
                        <button type="button" class="qty-btn" onclick="changeOptQty(-1)">-</button>
                    </div>
                </div>
                <div id="optSizeWrap" style="display:none;flex-direction:column;gap:5px;">
                    <span style="font-weight:800;font-size:0.8rem;">المقاس:</span>
                    <div class="pills" id="optSizePills"></div>
                </div>
                <div id="optColorWrap" style="display:none;flex-direction:column;gap:5px;">
                    <span style="font-weight:800;font-size:0.8rem;">اللون:</span>
                    <div class="pills" id="optColorPills"></div>
                </div>
                <textarea id="optNote" class="note-input" placeholder="ملاحظات إضافية (اختياري)..."></textarea>
            </div>
            <div class="drawer-foot">
                <button type="button" class="btn-primary" onclick="confirmOptionAdd()">إضافة للمشتريات</button>
            </div>
        </div>
    </div>

    <div class="backdrop" id="detailBackdrop" onclick="closeDetailModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="drawer-head"><span>تفاصيل المنتج</span><button type="button" onclick="closeDetailModal()" style="color:#fff;font-size:1.2rem;">&times;</button></div>
            <div class="modal-body">
                <div style="display:flex;justify-content:space-between;font-size:0.75rem;font-weight:800;">
                    <span id="detCat"></span>
                    <span id="detMerchant" style="color:var(--accent-deep);"></span>
                </div>
                <div id="detTitle" style="font-size:1rem;font-weight:900;"></div>
                <div id="detPrice" style="font-size:1.05rem;font-weight:900;color:var(--accent-deep);"></div>
                <div id="detDesc" style="background:#fff;padding:10px;border-radius:12px;font-size:0.84rem;"></div>
                <div class="card-actions">
                    <button type="button" class="btn-add" id="detAddBtn">+ للمشتريات</button>
                    <a href="#" class="btn-wa" id="detWaBtn" target="_blank" rel="noopener noreferrer">واتساب</a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <footer>جميع الحقوق محفوظة &copy; متجر كارامل - Caramel Store</footer>

    <script>
        const WA_NUM = "201055436305";
        const STORE_URL = "https://caramelashinstore.github.io/Carmela.store/";
        const CART_KEY = "caramel_store_cart_v1";
        const CATS = {
            all: "الكل", home: "المنزل", perfume: "العناية والعطور", gifts: "الهدايا",
            tafse: "هاند ميد", school: "المدرسة", women: "النساء", men: "الرجال", kids: "الأطفال"
        };

        let PRODUCTS = [];
        let cart = [];
        let activeCat = "all";
        let activeMerchant = "";
        let sortMode = "default";
        let trendList = [], dealList = [], trendIdx = 0, dealIdx = 0;
        let optState = { product: null, qty: 1, size: "", color: "", price: 0 };

        const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const norm = s => String(s || "").toLowerCase().replace(/[\u064B-\u065F]/g, "").replace(/[إأآا]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").trim();

        function toast(msg) {
            const el = document.getElementById("toast");
            el.textContent = msg;
            el.classList.add("show");
            setTimeout(() => el.classList.remove("show"), 2400);
        }

        async function shareStore() {
            if (navigator.share) { try { await navigator.share({ title: "متجر كارامل", url: STORE_URL }); return; } catch (e) {} }
            try { await navigator.clipboard.writeText(STORE_URL); toast("تم نسخ الرابط"); } catch (e) {}
        }

        async function loadMerchantsData() {
            try {
                const res = await fetch("merchants/index.json", { cache: "no-store" });
                if (!res.ok) return;
                const data = await res.json();
                const entries = Array.isArray(data) ? data : (Array.isArray(data.merchants) ? data.merchants : []);
                const all = await Promise.all(entries.map(async entry => {
                    const file = typeof entry === "string" ? entry : entry?.file;
                    const name = typeof entry === "object" ? entry?.name : "";
                    if (!file) return [];
                    const mRes = await fetch(file, { cache: "no-store" });
                    if (!mRes.ok) return [];
                    const mData = await mRes.json();
                    const list = Array.isArray(mData) ? mData : (Array.isArray(mData.products) ? mData.products : []);
                    return list.map(p => ({ ...p, merchant: p.merchant || name || "شيرين غريب" }));
                }));
                const flat = all.flat().filter(p => p && p.id);
                if (flat.length) PRODUCTS = flat;
            } catch (e) {
                console.warn("تعذر تحميل بيانات التجار:", e);
            }
        }

        function renderCatTabs() {
            const tabs = document.getElementById("topCatTabs");
            tabs.innerHTML = Object.entries(CATS).map(([k, v]) =>
                `<button type="button" class="cat-tab ${!activeMerchant && activeCat === k ? "active" : ""}" onclick="selectCat('${k}')">${esc(v)}</button>`
            ).join("");
        }

        function renderSpotlights() {
            if (!PRODUCTS.length) return;
            trendList = PRODUCTS.slice(0, 5);
            dealList = [...PRODUCTS].filter(p => Number(p.price) > 0).sort((a, b) => Number(a.price) - Number(b.price)).slice(0, 5);
            paintSpot("trends");
            paintSpot("deals");
        }

        function paintSpot(kind) {
            const list = kind === "trends" ? trendList : dealList;
            const box = document.getElementById(kind === "trends" ? "trendsBox" : "dealsBox");
            if (!box || !list.length) return;
            const idx = (kind === "trends" ? trendIdx : dealIdx) % list.length;
            const p = list[idx];
            box.innerHTML = `
                <div class="spot-item" onclick="openDetail('${p.id}')">
                    <div class="spot-item-title">${esc(p.title)}</div>
                    <div class="spot-item-meta">
                        <span>التاجر: ${esc(p.merchant)}</span>
                        <span class="spot-price">${esc(p.priceLabel || p.price)} جنيه</span>
                    </div>
                </div>
            `;
        }

        setInterval(() => {
            if (document.visibilityState !== "visible") return;
            if (trendList.length > 1) trendIdx = (trendIdx + 1) % trendList.length;
            if (dealList.length > 1) dealIdx = (dealIdx + 1) % dealList.length;
            paintSpot("trends");
            paintSpot("deals");
        }, 3500);

        function getFiltered() {
            const q = norm(document.getElementById("searchInput")?.value || "");
            let list = PRODUCTS.filter(p => {
                const catOk = activeCat === "all" || p.category === activeCat || (Array.isArray(p.categories) && p.categories.includes(activeCat));
                const merchOk = !activeMerchant || p.merchant === activeMerchant;
                const hay = norm(`${p.title} ${p.desc || ""} ${p.merchant || ""}`);
                const qOk = !q || q.split(/\s+/).every(w => hay.includes(w));
                return catOk && merchOk && qOk;
            });
            if (sortMode === "new") list = [...list].reverse();
            else if (sortMode === "cheap") list = [...list].sort((a, b) => (Number(a.price) || 999999) - (Number(b.price) || 999999));
            return list;
        }

        function renderProducts() {
            renderCatTabs();
            const qVal = document.getElementById("searchInput")?.value || "";
            document.getElementById("searchClearBtn")?.classList.toggle("show", qVal.length > 0);

            const list = getFiltered();
            const bar = document.getElementById("merchantBar");
            bar.classList.toggle("show", Boolean(activeMerchant));
            if (activeMerchant) {
                document.getElementById("merchantBarTitle").textContent = `التاجر: ${activeMerchant}`;
                document.getElementById("merchantBarCount").textContent = `(${list.length} منتج)`;
            }

            document.getElementById("sectionTitle").textContent = activeMerchant ? `منتجات ${activeMerchant}` : (CATS[activeCat] || "كل المنتجات");
            document.getElementById("countBadge").textContent = `${list.length} منتج`;

            const grid = document.getElementById("productsGrid");
            if (!list.length) {
                grid.innerHTML = `<div style="grid-column:1/-1;background:#fff;padding:24px;border-radius:16px;text-align:center;font-weight:800;">لا توجد منتجات مطابقة.</div>`;
                return;
            }

            grid.innerHTML = list.map(p => {
                const price = p.priceLabel || p.price;
                const wa = encodeURIComponent(`أريد طلب ${p.title} بسعر ${price} جنيه (التاجر: ${p.merchant}) من متجر كارامل`);
                return `
                    <article class="card">
                        <div>
                            <div class="card-title" onclick="openDetail('${p.id}')">${esc(p.title)}</div>
                            <div class="card-price">${esc(price)} جنيه</div>
                            ${p.desc ? `<div class="card-desc">${esc(p.desc)}</div>` : ""}
                            <button type="button" class="merchant-chip" onclick="selectMerchant('${esc(p.merchant)}')">التاجر: ${esc(p.merchant)}</button>
                        </div>
                        <div class="card-actions">
                            <button type="button" class="btn-add" onclick="openOptions('${p.id}')">+ للمشتريات</button>
                            <a href="https://wa.me/${WA_NUM}?text=${wa}" target="_blank" rel="noopener noreferrer" class="btn-wa">واتساب</a>
                        </div>
                    </article>
                `;
            }).join("");
        }

        function selectCat(cat) { activeMerchant = ""; activeCat = cat; renderProducts(); }
        function selectMerchant(m) { activeMerchant = m; activeCat = "all"; renderProducts(); }
        function clearMerchant() { activeMerchant = ""; renderProducts(); }
        function setSortMode(mode, btn) {
            sortMode = mode;
            document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
            renderProducts();
        }
        function clearSearch() { document.getElementById("searchInput").value = ""; renderProducts(); }
        function resetStore() { activeCat = "all"; activeMerchant = ""; sortMode = "default"; clearSearch(); }

        function openCatsDrawer() {
            document.getElementById("catsDrawerBody").innerHTML = Object.entries(CATS).map(([k, v]) =>
                `<button type="button" class="pill ${!activeMerchant && activeCat === k ? "active" : ""}" style="width:100%;text-align:right;padding:10px;" onclick="closeCatsDrawer();selectCat('${k}')">${esc(v)}</button>`
            ).join("");
            document.getElementById("catsDrawer").classList.add("open");
            document.getElementById("catsBackdrop").classList.add("show");
        }
        function closeCatsDrawer() {
            document.getElementById("catsDrawer").classList.remove("open");
            document.getElementById("catsBackdrop").classList.remove("show");
        }

        function openOptions(id) {
            const p = PRODUCTS.find(x => x.id === id);
            if (!p) return;
            const sizes = Array.isArray(p.sizes) ? p.sizes : (["women", "men", "kids"].includes(p.category) ? ["S", "M", "L", "XL", "XXL"] : []);
            const colors = Array.isArray(p.colors) ? p.colors : [];
            const firstSize = sizes[0] ? (typeof sizes[0] === "string" ? sizes[0] : sizes[0].label) : "";
            const firstPrice = sizes[0]?.price ? Number(sizes[0].price) : (Number(p.price) || 0);

            optState = { product: p, qty: 1, size: firstSize, color: colors[0] || "", price: firstPrice };
            document.getElementById("optTitle").textContent = p.title;
            document.getElementById("optPrice").textContent = `${firstPrice} جنيه`;
            document.getElementById("optQty").textContent = "1";
            document.getElementById("optNote").value = "";

            const sw = document.getElementById("optSizeWrap");
            if (sizes.length) {
                sw.style.display = "flex";
                document.getElementById("optSizePills").innerHTML = sizes.map(s => {
                    const lbl = typeof s === "string" ? s : s.label;
                    const pr = typeof s === "object" && s.price ? Number(s.price) : firstPrice;
                    return `<button type="button" class="pill ${lbl === optState.size ? "active" : ""}" onclick="pickSize('${esc(lbl)}', ${pr}, this)">${esc(lbl)}</button>`;
                }).join("");
            } else sw.style.display = "none";

            const cw = document.getElementById("optColorWrap");
            if (colors.length) {
                cw.style.display = "flex";
                document.getElementById("optColorPills").innerHTML = colors.map(c =>
                    `<button type="button" class="pill ${c === optState.color ? "active" : ""}" onclick="pickColor('${esc(c)}', this)">${esc(c)}</button>`
                ).join("");
            } else cw.style.display = "none";

            document.getElementById("optBackdrop").classList.add("show");
        }
        function changeOptQty(d) { optState.qty = Math.max(1, optState.qty + d); document.getElementById("optQty").textContent = String(optState.qty); }
        function pickSize(lbl, pr, btn) {
            optState.size = lbl; optState.price = pr;
            document.getElementById("optPrice").textContent = `${pr} جنيه`;
            document.querySelectorAll("#optSizePills .pill").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
        }
        function pickColor(lbl, btn) {
            optState.color = lbl;
            document.querySelectorAll("#optColorPills .pill").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
        }
        function closeOptionModal() { document.getElementById("optBackdrop").classList.remove("show"); }

        function confirmOptionAdd() {
            const p = optState.product;
            if (!p) return;
            cart.push({
                id: p.id, title: p.title, merchant: p.merchant,
                price: optState.price, qty: optState.qty,
                size: optState.size, color: optState.color,
                note: (document.getElementById("optNote").value || "").trim()
            });
            saveCart(); updateCartUI(); closeOptionModal(); toast("تمت الإضافة للمشتريات");
        }

        function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {} }
        function loadCart() { try { const r = localStorage.getItem(CART_KEY); cart = r ? JSON.parse(r) : []; } catch (e) { cart = []; } }
        function changeQty(i, d) { const n = (cart[i].qty || 1) + d; if (n <= 0) cart.splice(i, 1); else cart[i].qty = n; saveCart(); updateCartUI(); }
        function delItem(i) { cart.splice(i, 1); saveCart(); updateCartUI(); }
        function clearCart() { cart = []; saveCart(); updateCartUI(); }

        function updateCartUI() {
            const totalQty = cart.reduce((s, x) => s + (Number(x.qty) || 1), 0);
            const totalPrice = cart.reduce((s, x) => s + ((Number(x.price) || 0) * (Number(x.qty) || 1)), 0);
            const badge = document.getElementById("cartBadge");
            badge.textContent = totalQty > 0 ? String(totalQty) : "";
            badge.classList.toggle("show", totalQty > 0);
            document.getElementById("cartTotal").textContent = `${totalPrice} جنيه`;

            const body = document.getElementById("cartBody");
            if (!cart.length) { body.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-weight:800;">السلة فارغة</div>`; return; }
            body.innerHTML = cart.map((x, i) => `
                <div class="cart-row">
                    <div>
                        <div style="font-size:0.82rem;font-weight:900;">${esc(x.title)}</div>
                        <div style="font-size:0.7rem;color:var(--text-muted);font-weight:700;">${esc(x.merchant)} • ${(Number(x.price) || 0) * (Number(x.qty) || 1)} جنيه</div>
                    </div>
                    <div class="qty-box">
                        <button type="button" class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                        <span style="min-width:18px;text-align:center;font-weight:900;">${x.qty || 1}</span>
                        <button type="button" class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
                        <button type="button" class="del-btn" onclick="delItem(${i})">✕</button>
                    </div>
                </div>
            `).join("");
        }

        function openCart() { loadCart(); updateCartUI(); document.getElementById("cartDrawer").classList.add("open"); document.getElementById("cartBackdrop").classList.add("show"); }
        function closeCart() { document.getElementById("cartDrawer").classList.remove("open"); document.getElementById("cartBackdrop").classList.remove("show"); }

        function checkoutWA() {
            if (!cart.length) return;
            let total = 0;
            const lines = ["مرحبًا متجر كارامل، أريد تأكيد الطلب:", ""];
            cart.forEach((x, i) => {
                const q = Number(x.qty) || 1, p = Number(x.price) || 0;
                total += p * q;
                lines.push(`${i + 1}. ${x.title} (${x.merchant}) × ${q} = ${p * q} جنيه`);
            });
            lines.push("", `الإجمالي: ${total} جنيه`);
            window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(lines.join("\n"))}`, "_blank", "noopener,noreferrer");
        }

        function openDetail(id) {
            const p = PRODUCTS.find(x => x.id === id);
            if (!p) return;
            document.getElementById("detCat").textContent = CATS[p.category] || "كارامل";
            document.getElementById("detMerchant").textContent = `التاجر: ${p.merchant}`;
            document.getElementById("detTitle").textContent = p.title;
            document.getElementById("detPrice").textContent = `${p.priceLabel || p.price} جنيه`;
            document.getElementById("detDesc").textContent = p.desc || "منتج من متجر كارامل والدفع عند الاستلام.";
            document.getElementById("detAddBtn").onclick = () => { closeDetailModal(); openOptions(p.id); };
            document.getElementById("detWaBtn").href = `https://wa.me/${WA_NUM}?text=${encodeURIComponent(`أريد طلب ${p.title} من متجر كارامل`)}`;
            document.getElementById("detailBackdrop").classList.add("show");
        }
        function closeDetailModal() { document.getElementById("detailBackdrop").classList.remove("show"); }

        (async function init() {
            loadCart();
            updateCartUI();
            await loadMerchantsData();
            renderSpotlights();
            renderProducts();
        })();
    </script>
</body>
</html>
