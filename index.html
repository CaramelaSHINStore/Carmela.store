<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كارامل ستور | Caramel Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="brand">كارامل ستور <span>Caramel Store</span></a>
      <nav class="main-nav">
        <a href="#catalog">المنتجات</a>
        <button type="button" id="becomeMerchantBtn" class="nav-merchant-btn">كن تاجر</button>
      </nav>
    </div>
  </header>

  <main id="top" class="container">
    <!-- تم إزالة شريط التجار العلوي بناءً على طلبك -->

    <section class="filters-bar">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="ابحث عن منتج أو هدية أو إكسسوار..." />
      </div>
      <div id="categoriesContainer" class="categories-list"></div>
    </section>

    <section id="catalog" class="products-section">
      <div class="section-header">
        <h2>المنتجات المتاحة</h2>
        <span id="resultsCount" class="results-count"></span>
      </div>
      <div id="productsGrid" class="products-grid"></div>
    </section>
  </main>

  <!-- نافذة كن تاجر: الاسم، النشاط التجاري، رقم التواصل، وإرسال عبر واتساب -->
  <div id="merchantModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="merchantModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="merchantModalTitle">انضم كتاجر في كارامل ستور</h3>
        <button type="button" id="closeMerchantModal" class="close-btn" aria-label="إغلاق">&times;</button>
      </div>
      <form id="merchantForm" class="modal-form">
        <label>
          الاسم
          <input type="text" id="merchantName" required placeholder="اكتب اسمك أو اسم البراند" />
        </label>
        <label>
          النشاط التجاري
          <input type="text" id="merchantActivity" required placeholder="مثال: هدايا، إكسسوارات، ملابس، منتجات يدوية" />
        </label>
        <label>
          رقم التواصل
          <input type="tel" id="merchantPhone" required placeholder="مثال: 01xxxxxxxxx" />
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">إرسال عبر واتساب</button>
          <button type="button" id="cancelMerchantModal" class="btn-secondary">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
